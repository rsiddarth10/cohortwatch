# nginx for the web app: static files + /api → the API (prefix stripped). SSE: no buffering, long reads.
# Security headers (S10, OWASP ZAP baseline): CSP, no framing, no MIME sniffing, no browser features, no version banner.
server_tokens off;

server {
  listen 3000;
  root /usr/share/nginx/html;

  # connect-src: the API (same origin) and the OIDC issuer (token endpoint, discovery, JWKS). The issuer is
  # http://localhost:3200 in compose; in production the ingress sets this header with the real IdP origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:3200; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location = /api/events {
    proxy_pass http://api:3100/events$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header Cache-Control "no-store" always; # own header: the API sends its own security headers (helmet)
  }
  location /api/ {
    proxy_pass http://api:3100/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always; # API data is never cached; helmet sets the rest
  }
  location / {
    try_files $uri /index.html;
  }
}
