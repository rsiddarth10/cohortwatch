# nginx for the web app: static files + /api → the API (prefix stripped). SSE: no buffering, long reads.
server {
  listen 3000;
  root /usr/share/nginx/html;

  location = /api/events {
    proxy_pass http://api:3100/events$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass http://api:3100/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    try_files $uri /index.html;
  }
}
