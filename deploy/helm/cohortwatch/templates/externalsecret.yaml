{{- if .Values.externalSecrets.enabled }}
# External Secrets Operator: the Kubernetes Secret is created and refreshed from AWS Secrets Manager.
# No credential ever lives in this chart or in values files.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "cw.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
    {{- range $key, $remote := .Values.externalSecrets.remoteKeys }}
    - secretKey: {{ $key }}
      remoteRef: { key: {{ $remote }} }
    {{- end }}
{{- end }}
