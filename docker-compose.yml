# CohortWatch — one-command local stack.  `docker compose up`   |   clean reset: `docker compose down -v`
# Every value has a default, so a fresh clone needs no .env. Images are pinned (never `latest`).
name: cohortwatch

x-pg-env: &pg-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cw_postgres_dev}

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=2
      - --memory=2G
      - --default-log-level=warn
    ports:
      - '19092:19092' # Kafka API (host)
      - '18081:18081' # Schema Registry (host)
      - '19644:9644' # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: 'true'
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - '8080:8080'
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/admin/health >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    # TimescaleDB + pgvector image from day one (no switch in S3). Pinned: PG 16.15, TimescaleDB 2.30.1.
    image: timescale/timescaledb-ha:pg16.15-ts2.30.1
    environment:
      <<: *pg-env
    ports:
      - '${PG_HOST_PORT:-15432}:5432' # host 15432: 5432 is often taken by a local Postgres
    volumes:
      - postgres-data:/home/postgres/pgdata
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis/redis-stack-server:7.4.0-v1
    ports:
      - '${REDIS_HOST_PORT:-16379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    entrypoint: ['/bin/sh', '/scripts/topic-init.sh']
    environment:
      KAFKA_BROKERS: redpanda:9092
      LAPTOP_RETENTION: ${LAPTOP_RETENTION:-on}
      KAFKA_PARTITION_BYTES: ${KAFKA_PARTITION_BYTES:-268435456}
      BENCH_PARTITION_BYTES: ${BENCH_PARTITION_BYTES:-16777216}
    volumes:
      - ./infra/kafka/topic-init.sh:/scripts/topic-init.sh:ro
    depends_on:
      redpanda:
        condition: service_healthy
    restart: 'no'

  db-migrate:
    image: timescale/timescaledb-ha:pg16.15-ts2.30.1
    entrypoint: ['/bin/sh', '/scripts/migrate.sh']
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-cw_postgres_dev}
      CW_DB: cohortwatch
      CW_SIM_PASSWORD: ${CW_SIM_PASSWORD:-cw_sim_dev}
      CW_APP_PASSWORD: ${CW_APP_PASSWORD:-cw_app_dev}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./infra/db/migrate.sh:/scripts/migrate.sh:ro
      - ./infra/db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  rustfs:
    # S3-compatible object store for the Parquet lake (MinIO's public images were withdrawn).
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-cohortwatch}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-cohortwatch-dev-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${S3_HOST_PORT:-19000}:9000' # S3 API
      - '${S3_CONSOLE_HOST_PORT:-19001}:9001' # web console
    volumes:
      - lake-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 30

  lake-init:
    # One-shot: create the lake bucket (idempotent).
    image: amazon/aws-cli:2.37.4
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket cohortwatch-lake 2>/dev/null
        && echo 'bucket exists: cohortwatch-lake'
        || (aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket cohortwatch-lake
        && echo 'bucket created: cohortwatch-lake')
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cohortwatch}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-cohortwatch-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      rustfs:
        condition: service_healthy
    restart: 'no'

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    image: cohortwatch/simulator:dev
    environment: &sim-env
      SIM_SCALE: ${SIM_SCALE:-100000}
      SIM_SEED: ${SIM_SEED:-cohortwatch-42}
      SIM_WORKERS: ${SIM_WORKERS:-4}
      PLANTS: ${PLANTS:-on}
      SIM_MODE: ${SIM_MODE:-demo}
      SIM_SPEED: ${SIM_SPEED:-360}
      MESS: ${MESS:-on}
      AUTO_REPAIRS: ${AUTO_REPAIRS:-off}
      DEPOT_TRANSFER: ${DEPOT_TRANSFER:-off}
      GLOBAL_COOLANT_THRESHOLD_C: ${GLOBAL_COOLANT_THRESHOLD_C:-97}
      GLOBAL_BATT_TEMP_THRESHOLD_C: ${GLOBAL_BATT_TEMP_THRESHOLD_C:-47}
      SIM_PRIVATE_DIR: /app/data/sim-private
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cohortwatch}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-cohortwatch-dev-secret}
      LAKE_BUCKET: cohortwatch-lake
      S3_FORCE_PATH_STYLE: 'true'
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgres://cw_sim:${CW_SIM_PASSWORD:-cw_sim_dev}@postgres:5432/cohortwatch
      METRICS_PORT: 9464
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Default command: seed -> plants -> history (skipped if present) -> demo stream.
    command: ['node', 'services/simulator/dist/main.js', 'demo']
    ports:
      - '9464:9464' # Prometheus /metrics, /healthz, /clock
    volumes:
      # Ground truth lives here. NO LEAKS: mount ./data/sim-private ONLY into the simulator
      # and the evaluation job, never into a detection service (S2-S8).
      - ./data/sim-private:/app/data/sim-private
    depends_on:
      sim-history:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9464/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 900s # first boot seeds 100K vans and writes 7 days of history
    restart: unless-stopped

  sim-history:
    # One-shot: seed the registry, apply plants, write the 7-day history to the lake (all idempotent), then
    # exit, so the baselines batch job can run before the live stream and the state processor start.
    image: cohortwatch/simulator:dev
    environment: *sim-env
    command: ['node', 'services/simulator/dist/main.js', 'history']
    volumes:
      # the simulator itself (plants write ground truth); never mounted into detection services
      - ./data/sim-private:/app/data/sim-private
    depends_on:
      lake-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: 'no'

  baselines:
    # One-shot batch analytics job (S3): each van's normal + fault-rate table from the history lake
    # (Python 3.12 + DuckDB). Idempotent: skipped when this history was already processed.
    build:
      context: batch/baselines
    image: cohortwatch/baselines:dev
    environment:
      DATABASE_URL: postgres://cw_app:${CW_APP_PASSWORD:-cw_app_dev}@postgres:5432/cohortwatch
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cohortwatch}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-cohortwatch-dev-secret}
      S3_FORCE_PATH_STYLE: 'true'
      LAKE_BUCKET: cohortwatch-lake
      DUCKDB_MEMORY: ${BASELINES_MEMORY:-3GB}
    # NO data/sim-private mount: the job reads the lake and writes as cw_app.
    depends_on:
      sim-history:
        condition: service_completed_successfully
    restart: 'no'

  normaliser:
    build:
      context: .
      dockerfile: services/normaliser/Dockerfile
    image: cohortwatch/normaliser:dev
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      REDIS_URL: redis://redis:6379
      INPUT_TOPICS: ${NORMALISER_INPUT_TOPICS:-raw.oem-a.v1,raw.oem-b.v1}
      OUTPUT_TOPIC: ${NORMALISER_OUTPUT_TOPIC:-telemetry.canonical.v1}
      GROUP_ID: ${NORMALISER_GROUP_ID:-cg.normaliser}
      STATE_PREFIX: ${NORMALISER_STATE_PREFIX:-ar}
      ENCODING: ${NORMALISER_ENCODING:-avro}
      # event-time ms per wall ms, for the clock-skew check: the simulator's demo speed (set 1 for SIM_MODE=live)
      INGEST_CLOCK_SPEED: ${NORMALISER_CLOCK_SPEED:-360}
      BATCH_SIZE: ${NORMALISER_BATCH_SIZE:-2000}
      CONCURRENCY: ${NORMALISER_CONCURRENCY:-48}
      METRICS_PORT: 9465
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Stateless (per-VIN state lives in Redis): scale with NORMALISER_REPLICAS, up to the input partition
    # count (48). Each replica gets its own host port from the range for /metrics.
    deploy:
      replicas: ${NORMALISER_REPLICAS:-3}
    ports:
      - '9465-9468:9465' # Prometheus /metrics, /healthz, /ledger
    # NO data/sim-private mount: detection services never see ground truth.
    depends_on:
      topic-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9465/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  state-processor:
    build:
      context: .
      dockerfile: services/state-processor/Dockerfile
    image: cohortwatch/state-processor:dev
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      REDIS_URL: redis://redis:6379
      # cw_app: detection has no access to schema sim (ground truth)
      DATABASE_URL: postgres://cw_app:${CW_APP_PASSWORD:-cw_app_dev}@postgres:5432/cohortwatch
      GROUP_ID: ${STATE_GROUP_ID:-cg.state}
      STATE_PREFIX: ${STATE_PREFIX:-sp}
      ENCODING: ${NORMALISER_ENCODING:-avro}
      CHECKPOINT_MS: ${STATE_CHECKPOINT_MS:-10000}
      TELEMETRY: ${TELEMETRY:-on}
      TELEMETRY_BUCKET_MIN: ${TELEMETRY_BUCKET_MIN:-60}
      GLOBAL_COOLANT_THRESHOLD_C: ${GLOBAL_COOLANT_THRESHOLD_C:-97}
      GLOBAL_BATT_TEMP_THRESHOLD_C: ${GLOBAL_BATT_TEMP_THRESHOLD_C:-47}
      METRICS_PORT: 9466
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Per-VIN state is in memory per owned partition, checkpointed to Redis (ADR 0005): scale with
    # STATE_REPLICAS, up to the 48 input partitions.
    deploy:
      replicas: ${STATE_REPLICAS:-3}
    ports:
      - '9470-9473:9466' # Prometheus /metrics, /healthz, /stats
    # NO data/sim-private mount: detection services never see ground truth.
    depends_on:
      baselines:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9466/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  campaign-engine:
    build:
      context: .
      dockerfile: services/campaign-engine/Dockerfile
    image: cohortwatch/campaign-engine:dev
    environment:
      KAFKA_BROKERS: redpanda:9092
      # cw_app: detection has no access to schema sim (ground truth)
      DATABASE_URL: postgres://cw_app:${CW_APP_PASSWORD:-cw_app_dev}@postgres:5432/cohortwatch
      GROUP_ID: ${CAMPAIGN_GROUP_ID:-cg.campaign}
      CAMPAIGN_ALPHA: ${CAMPAIGN_ALPHA:-0.0001}
      METRICS_PORT: 9475
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Incidents are low volume: 1 replica. Key = family key keeps one writer per key if scaled (up to 24);
    # the outbox relay and the hourly at-risk refresh run on the advisory-lock leader only.
    deploy:
      replicas: ${CAMPAIGN_REPLICAS:-1}
    ports:
      - '9475-9476:9475' # Prometheus /metrics, /healthz
    # NO data/sim-private mount: detection services never see ground truth.
    depends_on:
      baselines:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9475/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  redpanda-data:
  postgres-data:
  lake-data:
